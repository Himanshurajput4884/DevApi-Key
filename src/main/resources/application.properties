spring.application.name=LaughApi
server.port=${PORT:8080}

logging.level.org.springframework=DEBUG

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (schema managed by Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDISUSER}
spring.data.redis.password=${REDIS_PASSWORD}

# JWT (secret must be Base64-encoded, at least 256 bits when decoded)
com.himanshu.kumar.laugh-api.token.secret-key=${JWT_SECRET}
com.himanshu.kumar.laugh-api.token.token-validity-minutes=60

# OpenAPI / Swagger
com.himanshu.kumar.laugh-api.open-api.enabled=true
com.himanshu.kumar.laugh-api.open-api.title=Laugh API
com.himanshu.kumar.laugh-api.open-api.description=Backend API with JWT auth and rate limiting
com.himanshu.kumar.laugh-api.open-api.api-version=1.0.0

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
server.forward-headers-strategy=framework
