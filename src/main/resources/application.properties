spring.application.name=DevApi
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/laugh_api
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (schema managed by Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis (rate-limit cache via Redisson)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT (secret must be Base64-encoded, at least 256 bits when decoded)
com.himanshu.kumar.laugh-api.token.secret-key=c2VjcmV0c2VjcmV0c2VjcmV0c2VjcmV0c2VjcmV0c2VjcmV0c2U=
com.himanshu.kumar.laugh-api.token.token-validity-minutes=60

# OpenAPI / Swagger
com.himanshu.kumar.laugh-api.open-api.enabled=true
com.himanshu.kumar.laugh-api.open-api.title=Laugh API
com.himanshu.kumar.laugh-api.open-api.description=Backend API with JWT auth and rate limiting
com.himanshu.kumar.laugh-api.open-api.api-version=1.0.0

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
